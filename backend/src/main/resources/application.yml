server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vku_field_survey}
    username: ${DB_USERNAME:vku_survey}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
  flyway:
    enabled: true
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,https://localhost}
  upload-dir: ${UPLOAD_DIR:./uploads}
